name: 💻 CLI Bug
description: Report an issue in the Open Interpreter CLI
labels:
  - Bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting a new issue, please search for existing issues to see if your issue has already been reported.
        If it has, please add a 👍 reaction (no need to leave a comment) to the existing issue instead of creating a new one.

        This repository tracks the current Rust Open Interpreter built on Codex. For the classic Python product, use the [community-maintained classic fork](https://github.com/endolith/open-interpreter). If the same bug occurs in unmodified Codex, report it to [openai/codex](https://github.com/openai/codex/issues).

        Make sure you are running the latest version of Open Interpreter. The bug you are experiencing may already have been fixed.

        If your version supports it, please run `interpreter doctor --json` and paste the output in the "doctor report" field below. This helps us diagnose install, config, auth, terminal, MCP, network, and local state issues.

  - type: input
    id: version
    attributes:
      label: What version of Open Interpreter is running?
      description: use `interpreter --version`
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: What subscription or API-key provider are you using?
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Which provider ID are you using?
      description: Use the provider shown in `/model`, or write `unknown`.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Which model ID were you using?
    validations:
      required: true
  - type: dropdown
    id: wire_api
    attributes:
      label: Which wire API is configured?
      options:
        - Responses
        - Chat Completions
        - Anthropic Messages
        - Not sure
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Which harness is selected?
      description: Use the value shown by `/harness`; the default is `codex`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: What platform is your computer?
      description: |
        For macOS and Linux: copy the output of `uname -mprs`
        For Windows: copy the output of `"$([Environment]::OSVersion | ForEach-Object VersionString) $(if ([Environment]::Is64BitOperatingSystem) { "x64" } else { "x86" })"` in the PowerShell console
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: What terminal emulator and version are you using (if applicable)?
      description: |
        Also note any multiplexer in use (screen / tmux / zellij).
        E.g., VS Code, Terminal.app, iTerm2, Ghostty, Windows Terminal (WSL / PowerShell)
  - type: textarea
    id: doctor
    attributes:
      label: Doctor report
      description: |
        If available, run `interpreter doctor --json` and paste the full output here.

        The report is designed to redact secrets, but please review it before submitting.
        If your Open Interpreter version does not support `doctor`, write `not available`.
      render: json
  - type: textarea
    id: actual
    attributes:
      label: What issue are you seeing?
      description: Please include the full error messages and prompts with PII redacted. If possible, please provide text instead of a screenshot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What steps can reproduce the bug?
      description: Explain the bug and provide a code snippet that can reproduce it. Please include thread id if applicable.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the expected behavior?
      description: If possible, please provide text instead of a screenshot.
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
