name: 🧑‍💻 Integration Bug
description: Report an issue with an Open Interpreter integration
labels:
  - Extension
body:
  - type: markdown
    attributes:
      value: |
        Before submitting a new issue, please search for existing issues to see if your issue has already been reported.
        If it has, please add a 👍 reaction (no need to leave a comment) to the existing issue instead of creating a new one.

        This repository tracks integrations for the current Rust Open Interpreter built on Codex. For the classic Python product, use the [community-maintained classic fork](https://github.com/endolith/open-interpreter). Bugs inherited unchanged from Codex belong in [openai/codex](https://github.com/openai/codex/issues).

  - type: input
    id: version
    attributes:
      label: What Open Interpreter integration are you using, and what version?
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: What subscription or API-key provider are you using?
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Which provider ID are you using?
      description: Use the configured provider ID, or write `unknown`.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Which model ID are you using?
    validations:
      required: true
  - type: dropdown
    id: wire_api
    attributes:
      label: Which wire API is configured?
      options:
        - Responses
        - Chat Completions
        - Anthropic Messages
        - Not sure
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Which harness is selected?
      description: Use the configured harness; the default is `codex`.
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: Which host application are you using?
      description: Like `VS Code`, `Cursor`, `Windsurf`, Terminal, or another host.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: What platform is your computer?
      description: |
        For macOS and Linux: copy the output of `uname -mprs`
        For Windows: copy the output of `"$([Environment]::OSVersion | ForEach-Object VersionString) $(if ([Environment]::Is64BitOperatingSystem) { "x64" } else { "x86" })"` in the PowerShell console
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What issue are you seeing?
      description: Please include the full error messages and prompts with PII redacted. If possible, please provide text instead of a screenshot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What steps can reproduce the bug?
      description: Explain the bug and provide a code snippet that can reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the expected behavior?
      description: If possible, please provide text instead of a screenshot.
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
